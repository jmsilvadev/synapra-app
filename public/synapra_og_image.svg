<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Synapra social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071417" />
      <stop offset="100%" stop-color="#0D1C20" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.9">
      <stop offset="0%" stop-color="#00E0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(80,90)">
    <image href="/synapra_final_logo.svg" x="0" y="0" width="320" height="80" preserveAspectRatio="xMinYMin meet"/>
  </g>

  <g transform="translate(80,220)">
    <text x="0" y="0" fill="#E6F7F7" font-size="60" font-weight="700" font-family="Segoe UI, Arial, sans-serif">
      Shared Context For AI Agents
    </text>
    <text x="0" y="72" fill="#8DECF3" font-size="38" font-weight="500" font-family="Segoe UI, Arial, sans-serif">
      Built for enterprise dev teams
    </text>
  </g>

  <g transform="translate(80,430)">
    <rect x="0" y="0" width="240" height="52" rx="26" fill="#00C6B8" fill-opacity="0.2" stroke="#00C6B8" />
    <text x="22" y="34" fill="#00E0FF" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Vectors + Text + Graphs</text>
  </g>
</svg>
